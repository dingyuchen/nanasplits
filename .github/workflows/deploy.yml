name: Deploy

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPLOY_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
  DEPLOY_ROOT: /home/hermes/nanasplits
  DEPLOY_USER: hermes

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name) == 'master' && 'Production' || 'Preview' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build Linux x64 binary
        run: bun run build:binary
        env:
          BUN_COMPILE_TARGET: bun-linux-x64-modern
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_PUBLIC_BASE_URL: ${{ vars.VITE_PUBLIC_BASE_URL }}

      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gh-action-runner
          ping: ${{ secrets.VPS_TAILSCALE_HOST }}

      - name: Deploy over Tailscale SSH
        shell: bash
        run: |
          set -euo pipefail

          case "${DEPLOY_BRANCH}" in
            master)
              target="master"
              ;;
            dev)
              target="dev"
              ;;
            *)
              echo "Unsupported deploy branch: ${DEPLOY_BRANCH}" >&2
              exit 1
              ;;
          esac

          remote="${DEPLOY_USER}@${{ secrets.VPS_TAILSCALE_HOST }}"
          remote_binary="${DEPLOY_ROOT}/dist/nanasplits"
          ssh_options=(-o StrictHostKeyChecking=accept-new)

          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "${remote}" "cd '${DEPLOY_ROOT}' && git checkout '${DEPLOY_BRANCH}' && git pull --ff-only origin '${DEPLOY_BRANCH}' && mkdir -p dist"
          scp "${ssh_options[@]}" dist/nanasplits "${remote}:${remote_binary}"
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "${remote}" "cd '${DEPLOY_ROOT}' && chmod 755 '${remote_binary}' && DEPLOY_ROOT='${DEPLOY_ROOT}' bun run deploy:local '${target}'"
